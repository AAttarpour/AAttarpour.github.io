cv:
  name: Ahmadreza Attarpour
  label: AI Scientist
  email: a.attarpour@mail.utoronto.ca
  location: Toronto, Ontario, Canada
  image: ""
  summary: AI Scientist with over 9 years of experience at the intersection of AI/ML, neuroscience, and healthcare. Expert in developing and deploying end-to-end AI pipelines for large-scale biomedical and microscopy data analysis, including foundation deep learning models and agentic AI systems leveraging vision–language representations.

  social_networks:
    - network: LinkedIn
      username: ahmadreza-attarpour
    - network: GitHub
      username: AAttarpour

  sections:
    Experience:
      - company: University Health Network (UHN) & Peter Munk Cardiac Centre (PMCC) AI Team
        position: AI Scientist
        location: Toronto, Canada
        url: https://pmcc.ai/
        start_date: 2025-11
        end_date: present
        highlights:
          - Leading the development of agentic AI workflows and foundation models for large-scale biomedical data.
          - Collaborating with interdisciplinary teams of clinicians and researchers to translate novel ML research into deployable solutions.
          - Serving in advisory and mentorship roles across multiple academic and applied AI projects (UHN AIHub, University of Toronto), including supervising interns and PhD students.

      - company: University of Toronto & Sunnybrook Research Institute
        position: PhD Researcher
        location: Toronto, Canada
        url: https://www.utoronto.ca/
        start_date: 2020-09
        end_date: 2025-11
        highlights:
          - "MAPL3: Developed a 3D computational pipeline for identifying individual axonal fibers and their brain-wide circuitry, combining CNNs and vision transformers with self-supervised learning (Jan. 2023 – May 2025)."
          - "ACE: Designed and implemented an end-to-end 3D pipeline for mapping local cell activity in tera-voxel light sheet microscopy datasets (~1TB/sample), integrating Monte Carlo dropout for uncertainty estimation (Jan. 2020 – Jan. 2025)."
          - "Foundation DL Model for Light Microscopy: Pretrained a foundation model on ~3 million 3D image patches using the 3DINO self-supervised approach; finetuned for axon, soma, and vascular segmentation (Jan. 2023 – Dec. 2025)."
          - Supervised four undergraduate thesis/summer students on research projects in ML/DL and data analysis.

      - company: RayanMindware Co.
        position: Software Engineer and Programmer
        location: Isfahan, Iran
        start_date: 2017-02
        end_date: 2019-07
        highlights:
          - Developed algorithms for time-frequency EEG signal analysis using MATLAB.
          - Optimized MATLAB scripts and chipset code in C++ to enhance performance.
          - Developed and tested wireless data transfer systems for EOG signals.

